<!doctype html>
<html lang="en-SG">
<head>

  <title>Kaypoh for Good</title>

<body>
  <!-- Desktop header; filled in by app.js. Phones use each page's own top bar and the bottom tabs. -->
  <header id="sitenav" class="sitenav"></header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer id="sitefoot" class="sitefoot">
    <div class="inner">
      <div class="stack" style="gap:8px">
        <a class="brand" href="#/"><span data-eyes></span>kaypoh for good</a>
        <p class="muted">Be nosy about what matters. Free events by ground-ups, non-profits and charities across Singapore.</p>
      </div>
      <nav class="foot-links" aria-label="Footer">
        <a href="#/discover">What's on</a>
        <a href="#/passport">Passport</a>
        <a href="#/organisers">List your event</a>
      </nav>
      <p class="tiny muted foot-note">All events are free · Questions? <span class="selectable">enquiry@sgsocialsupport.com</span> <button class="textlink tiny" id="cookie-settings" type="button" hidden>· Cookie settings</button></p>
    </div>
  </footer>

  <nav id="tabbar" class="tabbar" hidden aria-label="Main">
    <a href="#/discover" data-tab="discover"><span data-icon="compass"></span>Discover</a>
    <a href="#/saved" data-tab="saved"><span data-icon="heart"></span>Saved</a>
    <a href="#/passport" data-tab="passport"><span data-icon="award"></span>Passport</a>
    <a href="#/me" data-tab="me"><span data-icon="user"></span>Me</a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="consent" class="consent" role="region" aria-label="Cookie choice" hidden></div>
